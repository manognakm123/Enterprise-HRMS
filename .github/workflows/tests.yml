name: HRMS Automation Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install

      - name: Create database
        run: |
          python database/create_database.py

      - name: Start Flask application
        shell: powershell
        run: |
          Start-Process python -ArgumentList "hrms_app/app.py"

          $maxAttempts = 30

          for ($i = 1; $i -le $maxAttempts; $i++) {
            try {
                $response = Invoke-WebRequest `
                      -Uri "http://127.0.0.1:5000/" `
                      -UseBasicParsing `
                      -TimeoutSec 2
                
                if ($response.StatusCode -eq 200) {
                    Write-Host "Flask application is running."
                    break
                }
              }
              catch {
                  Write-Host "Waiting for Flask application..."
              }
              
              Start-Sleep -Seconds 1

              if ($i -eq $maxAttempts) {
                  Write-Error "Flask application failed to start."
                  exit 1
              }
          }

      - name: Run tests
        run: |
          pytest automation_framework/tests -v