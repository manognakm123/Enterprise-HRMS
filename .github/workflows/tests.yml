name: HRMS Automation Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install

      - name: Create database
        shell: powershell
        run: |
          python database/create_database.py

      - name: Verify database
        shell: powershell
        run: |
          Write-Host "===== DATABASE TABLES ====="

          python -c "import sqlite3; c=sqlite3.connect('database/hrms.db'); print(c.execute(\"SELECT name FROM sqlite_master WHERE type='table'\").fetchall()); c.close()"

          Write-Host "===== EMPLOYEES ====="

          python -c "import sqlite3; c=sqlite3.connect('database/hrms.db'); print(c.execute('SELECT employee_id, first_name, last_name, email, department, designation FROM employees').fetchall()); c.close()"

      - name: Start Flask application
        shell: powershell
        run: |
          $process = Start-Process python `
              -ArgumentList "hrms_app/app.py" `
              -NoNewWindow `
              -PassThru `
              -RedirectStandardOutput "flask.log" `
              -RedirectStandardError "flask_error.log"

          $maxAttempts = 60
          $ready = $false

          for ($i = 0; $i -lt $maxAttempts; $i++) {

              Start-Sleep -Milliseconds 500

              try {
                  $null = Invoke-WebRequest `
                      -Uri "http://127.0.0.1:5000/" `
                      -UseBasicParsing `
                      -TimeoutSec 2 `
                      -ErrorAction Stop

                  $ready = $true

                  Write-Host "Flask application is ready."

                  break
              }
              catch {
                  Write-Host "Waiting for Flask... Attempt $($i + 1)/$maxAttempts"
              }

              if ($process.HasExited) {

                  Write-Host "Flask application stopped unexpectedly."

                  Write-Host "===== FLASK OUTPUT ====="

                  if (Test-Path "flask.log") {
                      Get-Content "flask.log"
                  }

                  Write-Host "===== FLASK ERROR ====="

                  if (Test-Path "flask_error.log") {
                      Get-Content "flask_error.log"
                  }

                  exit 1
              }
          }

          if (-not $ready) {

              Write-Error "Flask application failed to start."

              Write-Host "===== FLASK OUTPUT ====="

              if (Test-Path "flask.log") {
                  Get-Content "flask.log"
              }

              Write-Host "===== FLASK ERROR ====="

              if (Test-Path "flask_error.log") {
                  Get-Content "flask_error.log"
              }

              exit 1
          }

      - name: Verify environment before tests
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "CURRENT DIRECTORY"
          Write-Host "======================================"

          Get-Location

          Write-Host "======================================"
          Write-Host "DATABASE FILE"
          Write-Host "======================================"

          if (Test-Path "database/hrms.db") {
              Write-Host "Database file EXISTS"
          }
          else {
              Write-Error "Database file DOES NOT EXIST"
              exit 1
          }

          Write-Host "======================================"
          Write-Host "DATABASE TABLES"
          Write-Host "======================================"

          python -c "import sqlite3; c=sqlite3.connect('database/hrms.db'); print(c.execute(\"SELECT name FROM sqlite_master WHERE type='table'\").fetchall()); c.close()"

          Write-Host "======================================"
          Write-Host "EMPLOYEES IN DATABASE"
          Write-Host "======================================"

          python -c "import sqlite3; c=sqlite3.connect('database/hrms.db'); print(c.execute('SELECT employee_id, first_name, last_name, email, department, designation FROM employees').fetchall()); c.close()"

          Write-Host "======================================"
          Write-Host "PYTHON PROCESSES"
          Write-Host "======================================"

          Get-Process python -ErrorAction SilentlyContinue

          Write-Host "======================================"
          Write-Host "FLASK OUTPUT"
          Write-Host "======================================"

          if (Test-Path "flask.log") {
              Get-Content flask.log
          }
          else {
              Write-Host "flask.log does not exist"
          }

          Write-Host "======================================"
          Write-Host "FLASK ERROR OUTPUT"
          Write-Host "======================================"

          if (Test-Path "flask_error.log") {
              Get-Content flask_error.log
          }
          else {
              Write-Host "flask_error.log does not exist"
          }

          Write-Host "======================================"
          Write-Host "TESTING FLASK CONNECTION"
          Write-Host "======================================"

          try {
              $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:5000/" `
                  -UseBasicParsing `
                  -TimeoutSec 5 `
                  -ErrorAction Stop

              Write-Host "Flask HTTP Status Code: $($response.StatusCode)"
              Write-Host "Flask application is reachable."
          }
          catch {
              Write-Error "Flask application is NOT reachable."
              Write-Error $_
              exit 1
          }

      - name: Run tests
        shell: powershell
        run: |
          pytest automation_framework/tests -v