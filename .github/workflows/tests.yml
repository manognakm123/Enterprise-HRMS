name: Enterprise HRMS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest

    steps:

      # -----------------------------------------
      # 1. Checkout repository
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------
      # 2. Setup Python
      # -----------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # -----------------------------------------
      # 3. Install dependencies
      # -----------------------------------------
      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install

      # -----------------------------------------
      # 4. Install Allure CLI
      # -----------------------------------------
      - name: Install Allure CLI
        shell: powershell
        run: |
          Write-Host "Installing Allure CLI..."

          $allureVersion = "2.44.1"
          $allureZip = "$env:RUNNER_TEMP\allure-$allureVersion.zip"
          $allureDir = "$env:RUNNER_TEMP\allure-$allureVersion"

          Invoke-WebRequest `
              -Uri "https://github.com/allure-framework/allure2/releases/download/$allureVersion/allure-$allureVersion.zip" `
              -OutFile $allureZip

          Expand-Archive `
              -Path $allureZip `
              -DestinationPath $env:RUNNER_TEMP `
              -Force

          $env:Path += ";$allureDir\bin"

          echo "$allureDir\bin" >> $env:GITHUB_PATH

          Write-Host "Checking Allure installation..."
          allure --version

      # -----------------------------------------
      # 5. Create database
      # -----------------------------------------
      - name: Create database
        shell: powershell
        run: |
          Write-Host "Creating HRMS database..."

          python database/create_database.py

          if (-not (Test-Path "database/hrms.db")) {
              Write-Error "Database file was not created."
              exit 1
          }

          Write-Host "Database file created successfully."

      # -----------------------------------------
      # 6. Verify database
      # -----------------------------------------
      - name: Verify database
        shell: powershell
        run: |
          Write-Host "Verifying database..."

          @"
          import sqlite3

          db_path = "database/hrms.db"

          connection = sqlite3.connect(db_path)
          cursor = connection.cursor()

          tables = cursor.execute(
              "SELECT name FROM sqlite_master WHERE type='table'"
          ).fetchall()

          employees = cursor.execute(
              "SELECT employee_id, first_name, last_name FROM employees"
          ).fetchall()

          users = cursor.execute(
              "SELECT username FROM users"
          ).fetchall()

          print("Tables:", tables)
          print("Employees:", employees)
          print("Users:", users)

          required_tables = {"users", "employees"}
          actual_tables = {table[0] for table in tables}

          missing_tables = required_tables - actual_tables

          if missing_tables:
              raise RuntimeError(
                  f"Missing required tables: {missing_tables}"
              )

          if not users:
              raise RuntimeError("Users table is empty.")

          if not employees:
              raise RuntimeError("Employees table is empty.")

          connection.close()

          print("Database verification successful.")
          "@ | Set-Content verify_database.py

          python verify_database.py

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Database verification failed."
              exit 1
          }

          Remove-Item verify_database.py -Force

      # -----------------------------------------
      # 7. Start Flask + Run marker-based tests
      # -----------------------------------------
      - name: Start Flask and run tests
        shell: powershell
        run: |
          Write-Host "Starting Flask application..."

          $process = Start-Process `
              -FilePath "python" `
              -ArgumentList "hrms_app/app.py" `
              -WorkingDirectory "$PWD" `
              -PassThru `
              -RedirectStandardOutput "$PWD\flask.log" `
              -RedirectStandardError "$PWD\flask_error.log"

          Write-Host "Flask process ID: $($process.Id)"

          try {

              # -----------------------------------------
              # Wait for Flask application
              # -----------------------------------------

              $maxAttempts = 60
              $ready = $false

              for ($i = 1; $i -le $maxAttempts; $i++) {

                  Start-Sleep -Seconds 1

                  if ($process.HasExited) {
                      Write-Error "Flask process stopped unexpectedly."

                      if (Test-Path "flask.log") {
                          Write-Host "========== flask.log =========="
                          Get-Content "flask.log"
                      }

                      if (Test-Path "flask_error.log") {
                          Write-Host "========== flask_error.log =========="
                          Get-Content "flask_error.log"
                      }

                      throw "Flask process exited."
                  }

                  try {

                      $response = Invoke-WebRequest `
                          -Uri "http://127.0.0.1:5000/" `
                          -UseBasicParsing `
                          -TimeoutSec 3 `
                          -ErrorAction Stop

                      if ($response.StatusCode -eq 200) {

                          Write-Host "Flask application is READY."
                          $ready = $true
                          break
                      }

                  }
                  catch {

                      Write-Host "Waiting for Flask... Attempt $i/$maxAttempts"
                  }
              }

              if (-not $ready) {

                  Write-Error "Flask application failed to start."

                  if (Test-Path "flask.log") {
                      Write-Host "========== flask.log =========="
                      Get-Content "flask.log"
                  }

                  if (Test-Path "flask_error.log") {
                      Write-Host "========== flask_error.log =========="
                      Get-Content "flask_error.log"
                  }

                  throw "Flask application failed to start."
              }

              # -----------------------------------------
              # Verify Flask API
              # -----------------------------------------

              Write-Host "Checking Flask API..."

              $apiResponse = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:5000/api/employees" `
                  -UseBasicParsing `
                  -TimeoutSec 10 `
                  -ErrorAction Stop

              Write-Host "API Status Code: $($apiResponse.StatusCode)"
              Write-Host "API Response:"
              Write-Host $apiResponse.Content

              if ($apiResponse.StatusCode -ne 200) {
                  throw "Flask API health check failed."
              }

              Write-Host "Flask API is healthy."

              # -----------------------------------------
              # Create reports directory
              # -----------------------------------------

              New-Item `
                  -ItemType Directory `
                  -Force `
                  -Path "reports" | Out-Null

              # -----------------------------------------
              # Create Allure results directory
              # -----------------------------------------

              New-Item `
                  -ItemType Directory `
                  -Force `
                  -Path "allure-results" | Out-Null

              # -----------------------------------------
              # Run smoke tests
              # -----------------------------------------

              Write-Host "========================================"
              Write-Host "Running SMOKE tests..."
              Write-Host "========================================"

              pytest -m smoke -v -s `
                  --html=reports/smoke_report.html `
                  --self-contained-html `
                  --alluredir=allure-results

              if ($LASTEXITCODE -ne 0) {
                  throw "Smoke test execution failed."
              }

              Write-Host "Smoke tests passed successfully."

              # -----------------------------------------
              # Run regression tests
              # -----------------------------------------

              Write-Host "========================================"
              Write-Host "Running REGRESSION tests..."
              Write-Host "========================================"

              pytest -m regression -v -s `
                  --html=reports/regression_report.html `
                  --self-contained-html `
                  --alluredir=allure-results

              if ($LASTEXITCODE -ne 0) {
                  throw "Regression test execution failed."
              }

              Write-Host "Regression tests passed successfully."

              # -----------------------------------------
              # Generate Allure report
              # -----------------------------------------

              Write-Host "========================================"
              Write-Host "Generating ALLURE report..."
              Write-Host "========================================"

              allure generate allure-results `
                  -o reports/allure-report `
                  --clean

              if ($LASTEXITCODE -ne 0) {
                  throw "Allure report generation failed."
              }

              Write-Host "Allure report generated successfully."

              Write-Host "========================================"
              Write-Host "All CI tests passed successfully."
              Write-Host "========================================"

          }
          finally {

              # -----------------------------------------
              # Display Flask logs
              # -----------------------------------------

              Write-Host "========== Flask Output =========="

              if (Test-Path "flask.log") {
                  Get-Content "flask.log"
              }

              Write-Host "========== Flask Errors =========="

              if (Test-Path "flask_error.log") {
                  Get-Content "flask_error.log"
              }

              # -----------------------------------------
              # Stop Flask
              # -----------------------------------------

              if ($process -and -not $process.HasExited) {

                  Write-Host "Stopping Flask process..."

                  Stop-Process `
                      -Id $process.Id `
                      -Force `
                      -ErrorAction SilentlyContinue
              }
          }

      # -----------------------------------------
      # 8. Upload Smoke Test Report
      # -----------------------------------------
      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: reports/smoke_report.html
          if-no-files-found: warn

      # -----------------------------------------
      # 9. Upload Regression Test Report
      # -----------------------------------------
      - name: Upload regression test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-report
          path: reports/regression_report.html
          if-no-files-found: warn

      # -----------------------------------------
      # 10. Upload Allure Report
      # -----------------------------------------
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report
          if-no-files-found: warn

      # -----------------------------------------
      # 11. Upload Allure Results
      # -----------------------------------------
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn
