name: HRMS Automation Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install

      - name: Create database
        shell: powershell
        run: |
          python database/create_database.py

      - name: Verify database
        shell: powershell
        run: |
          python -c "import sqlite3; c=sqlite3.connect('database/hrms.db'); print(c.execute(\"SELECT name FROM sqlite_master WHERE type='table'\").fetchall()); print(c.execute(\"SELECT employee_id FROM employees\").fetchall()); c.close()"

      - name: Start Flask application
        shell: powershell
        run: |
          $process = Start-Process python `
              -ArgumentList "hrms_app/app.py" `
              -NoNewWindow `
              -PassThru `
              -RedirectStandardOutput "flask.log" `
              -RedirectStandardError "flask_error.log"

          $maxAttempts = 60
          $ready = $false

          for ($i = 0; $i -lt $maxAttempts; $i++) {

              Start-Sleep -Milliseconds 500

              try {
                  $null = Invoke-WebRequest `
                      -Uri "http://127.0.0.1:5000/" `
                      -UseBasicParsing `
                      -TimeoutSec 2 `
                      -ErrorAction Stop

                  $ready = $true
                  Write-Host "Flask application is ready."
                  break
              }
              catch {
                  Write-Host "Waiting for Flask... Attempt $($i + 1)/$maxAttempts"
              }

              if ($process.HasExited) {
                  Write-Host "Flask application stopped unexpectedly."

                  if (Test-Path "flask.log") {
                      Get-Content "flask.log"
                  }

                  if (Test-Path "flask_error.log") {
                      Get-Content "flask_error.log"
                  }

                  exit 1
              }
          }

          if (-not $ready) {
              Write-Error "Flask application failed to start."

              if (Test-Path "flask.log") {
                  Get-Content "flask.log"
              }

              if (Test-Path "flask_error.log") {
                  Get-Content "flask_error.log"
              }

              exit 1
          }

      - name: Run tests
        shell: powershell
        run: |
          pytest automation_framework/tests -v